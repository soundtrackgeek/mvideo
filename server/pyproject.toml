[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mvideo-server"
version = "0.4.1"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.2", "uvicorn==0.42.0", "httpx==0.28.1", "python-dotenv==1.2.2"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
mvideo = "mvideo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
